version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: apnidukan_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apnidukan_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apnidukan_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: apnidukan_backend
    command: >
      sh -c "python manage.py migrate &&
             python scripts/seed_data.py &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-apni-dukan-production-secret}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=*
      - POSTGRES_DB=${POSTGRES_DB:-apnidukan_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: apnidukan_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
